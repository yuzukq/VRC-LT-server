# /etc/nginx/sites-available/vrc-lt.conf
# シンボリックリンク: ln -s /etc/nginx/sites-available/vrc-lt.conf /etc/nginx/sites-enabled/

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    server_name lt.example.com;  # ← 自分のドメインに変更

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lt.example.com;  # ← 自分のドメインに変更

    ssl_certificate     /etc/letsencrypt/live/lt.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lt.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # MP4シーク用バッファ設定 (ngx_http_mp4_module)
    location /videos/ {
        root /opt/vrc-lt;

        # ngx_http_mp4_module: MP4のシーク (ページ戻し) を可能にする
        mp4;
        mp4_buffer_size    1m;
        mp4_max_buffer_size 20m;

        # CORS: VRChatのVideoPlayerからのアクセスを許可
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";

        # ディレクトリリスティングは無効化
        autoindex off;
    }
}
